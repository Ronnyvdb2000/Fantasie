name: A Meta-labeling Classifier

on:
  schedule:
    # Wekelijks op zondag om 05:00 UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      horizon:
        description: 'Forward horizon in dagen (5, 10, 20, 30, 60)'
        required: false
        default: '10'
      threshold:
        description: 'Label threshold in % (middenzone wordt uitgesloten)'
        required: false
        default: '3.0'
      model:
        description: 'Modeltype'
        required: true
        default: 'logreg'
        type: choice
        options:
          - logreg
          - xgb
      strategieen:
        description: 'Komma-gescheiden lijst van strategieën'
        required: false
        default: 'bot_01kasstr'
      train_tot:
        description: 'OOS-cutoff (YYYY-MM-DD). Leeg = rolling walk-forward (cron-gedrag).'
        required: false
        default: ''
      geen_db_write:
        description: 'Schrijf niet naar meta_label_scores (alleen console)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      geen_notify:
        description: 'Stuur geen Telegram/e-mail'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: meta-label-classifier
  cancel-in-progress: false

jobs:
  classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scipy==1.14.1 \
            psycopg2-binary==2.9.10 \
            scikit-learn==1.5.2 \
            xgboost==2.1.3 \
            requests

      - name: Verifieer installaties
        run: |
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import scipy; print('scipy', scipy.__version__)"
          python -c "import psycopg2; print('psycopg2 OK')"
          python -c "import sklearn; print('sklearn', sklearn.__version__)"
          python -c "import xgboost; print('xgboost', xgboost.__version__)"
          python -c "import requests; print('requests', requests.__version__)"

      - name: Check verplichte secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "FOUT: SUPABASE_DB_URL secret ontbreekt"
            exit 1
          fi

      - name: Check optionele secrets (waarschuwing)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram-secrets ontbreken — er wordt geen Telegram-bericht verstuurd."
          fi
          if [ -z "$EMAIL_USER" ] || [ -z "$EMAIL_PASS" ] || [ -z "$EMAIL_RECEIVER" ]; then
            echo "::warning::E-mail-secrets ontbreken — er wordt geen e-mail verstuurd."
          fi

      - name: Bot draaien
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          set -o pipefail

          HORIZON="${{ github.event.inputs.horizon || '10' }}"
          THRESHOLD="${{ github.event.inputs.threshold || '3.0' }}"
          MODEL="${{ github.event.inputs.model || 'logreg' }}"
          STRATS="${{ github.event.inputs.strategieen || 'bot_01kasstr' }}"
          # v1.8: leeg = rolling walk-forward (cron-gedrag); gevuld = OOS-modus
          TRAIN_TOT="${{ github.event.inputs.train_tot }}"

          FLAGS=""
          if [ "${{ github.event.inputs.geen_db_write }}" = "true" ]; then
            FLAGS="$FLAGS --geen-db-write"
          fi
          if [ "${{ github.event.inputs.geen_notify }}" = "true" ]; then
            FLAGS="$FLAGS --geen-notify"
          fi

          # v1.8: bouw optionele --train-tot flag
          TRAIN_FLAG=""
          if [ -n "$TRAIN_TOT" ]; then
            TRAIN_FLAG="--train-tot $TRAIN_TOT"
          fi

          echo "============================================================"
          echo "Meta-labeling classifier start"
          echo "  horizon     = $HORIZON"
          echo "  threshold   = $THRESHOLD"
          echo "  model       = $MODEL"
          echo "  strategieen = $STRATS"
          echo "  train_tot   = ${TRAIN_TOT:-<leeg, rolling>}"
          echo "  extra flags = $FLAGS"
          echo "============================================================"

          python a_meta_label_classifier.py \
            --horizon "$HORIZON" \
            --threshold "$THRESHOLD" \
            --model "$MODEL" \
            --strategieen "$STRATS" \
            --min-train 100 \
            --min-test 5 \
            $TRAIN_FLAG \
            $FLAGS \
            2>&1 | tee meta_label_output.log

      - name: Volledige output bewaren als artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meta-label-output-${{ github.run_number }}
          path: meta_label_output.log
          if-no-files-found: warn
          retention-days: 30

      - name: Samenvatting in GitHub Actions
        if: always()
        run: |
          if [ -f meta_label_output.log ]; then
            echo "## Meta-labeling resultaat" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 meta_label_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
