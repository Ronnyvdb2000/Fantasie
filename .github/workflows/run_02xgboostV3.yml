name: XGBoostV3 Model Retraining

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  train-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

    # ============================================================
    # 1. REPOSITORY CHECKOUT
    # ============================================================
    - name: Uitpakken repository code
      uses: actions/checkout@v4

    # ============================================================
    # 2. PYTHON
    # ============================================================
    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # ============================================================
    # 3. PACKAGES
    # ============================================================
    - name: Benodigde pakketten installeren
      run: |
        python -m pip install --upgrade pip

        pip install \
          xgboost==3.2.0 \
          pandas \
          scikit-learn \
          joblib \
          psycopg2-binary \
          requests

    # ============================================================
    # 4. OUDE ONGELDIGE MODELFILES VERWIJDEREN
    #
    # Een model kleiner dan 1000 bytes is geen geldig XGBoost-model.
    #
    # BELANGRIJK:
    # Een bestaand geldig model wordt NIET verwijderd.
    # ============================================================
    - name: Controleer oude modelbestanden
      shell: bash
      run: |
        set -euo pipefail

        echo ""
        echo "========================================"
        echo "CONTROLE OUDE MODELFILES"
        echo "========================================"

        for f in \
          xgboostV3_10d_model.pkl \
          xgboostV3_30d_model.pkl \
          xgboostV3_60d_model.pkl
        do
          if [ -f "$f" ]; then

            grootte=$(stat -c%s "$f")

            echo ""
            echo "$f: $grootte bytes"

            if [ "$grootte" -lt 1000 ]; then
              echo "⚠️ Ongeldig/placeholderbestand."
              echo "🗑️ Verwijderen: $f"
              rm -f "$f"
            else
              echo "✅ Bestand groot genoeg."
              echo "➡️ Bestaand model wordt behouden."
            fi

          else
            echo ""
            echo "$f bestaat niet."
          fi
        done

        echo ""
        echo "Modelbestanden na opschoning:"
        ls -lah xgboostV3_*_model.pkl 2>/dev/null || true

    # ============================================================
    # 5. TRAINING
    # ============================================================
    - name: Start training script
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

      run: |
        python xgboostV3.py

    # ============================================================
    # 6. MODEL VALIDATIE
    #
    # We controleren echte laadbaarheid met joblib.
    # Alleen bestandsgrootte controleren is niet voldoende.
    # ============================================================
    - name: Valideer modelbestanden
      shell: bash
      run: |
        set -euo pipefail

        python <<'PY'
        import os
        import sys
        import joblib

        modellen = [
            "xgboostV3_10d_model.pkl",
            "xgboostV3_30d_model.pkl",
            "xgboostV3_60d_model.pkl",
        ]

        verwachte_features = [
            "atr14",
            "atr14_pct",
            "rsi14",
            "ibs",
            "ma50",
            "ma200",
            "pct_from_ma50",
            "pct_from_ma200",
            "vol_ratio_20d",
            "high52w",
            "pct_from_high52w",
        ]

        geldig = 0

        print("")
        print("=" * 70)
        print("ECHTE VALIDATIE VAN XGBOOSTV3 MODELFILES")
        print("=" * 70)

        for bestand in modellen:

            print("")
            print(f"[CONTROLE] {bestand}")

            if not os.path.exists(bestand):
                print("⏳ Niet aanwezig.")
                print("   Dit is toegestaan zolang voor deze horizon")
                print("   nog onvoldoende historische data beschikbaar is.")
                continue

            grootte = os.path.getsize(bestand)

            print(f"   Grootte: {grootte:,} bytes")

            if grootte < 1000:
                print("❌ Ongeldig: bestand kleiner dan 1000 bytes.")
                sys.exit(1)

            try:
                model = joblib.load(bestand)
            except Exception as exc:
                print(f"❌ joblib.load() mislukt: {exc}")
                sys.exit(1)

            if not hasattr(model, "predict_proba"):
                print("❌ Model heeft geen predict_proba().")
                sys.exit(1)

            if not hasattr(model, "feature_names_in_"):
                print("❌ Model heeft geen feature_names_in_.")
                sys.exit(1)

            echte_features = list(model.feature_names_in_)

            if echte_features != verwachte_features:
                print("❌ Verkeerde featurevolgorde/features.")
                print(f"   Verwacht: {verwachte_features}")
                print(f"   Gevonden: {echte_features}")
                sys.exit(1)

            print(
                f"✅ Geldig XGBoost-model "
                f"({grootte:,} bytes, {len(echte_features)} features)"
            )

            geldig += 1

        print("")
        print("=" * 70)
        print(f"✅ Aantal geldige modellen: {geldig}/3")
        print("=" * 70)

        if geldig == 0:
            print("")
            print("❌ GEEN ENKEL GELDIG MODEL BESCHIKBAAR.")
            print("De workflow wordt gestopt.")
            sys.exit(1)

        print("")
        print("Training kan worden gepubliceerd.")
        PY

    # ============================================================
    # 7. DEBUG / GIT STATUS
    # ============================================================
    - name: Controleer Git status en modellen
      shell: bash
      run: |
        set -euo pipefail

        echo ""
        echo "========================================"
        echo "GIT STATUS"
        echo "========================================"

        git status --short || true

        echo ""
        echo "========================================"
        echo "MODELFILES"
        echo "========================================"

        ls -lah xgboostV3_*_model.pkl 2>/dev/null || true

        echo ""
        echo "========================================"
        echo "GIT DIFF STATISTIEKEN"
        echo "========================================"

        git diff --stat || true

    # ============================================================
    # 8. COMMIT + PUSH
    #
    # GEEN expliciete pathspecs meer!
    #
    # git add -A verwerkt:
    #   - nieuwe files
    #   - gewijzigde files
    #   - verwijderde files
    #
    # Daardoor krijgen we niet meer:
    # fatal: pathspec ... did not match any files
    # ============================================================
    - name: Commit en push modelwijzigingen
      shell: bash
      run: |
        set -euo pipefail

        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

        echo ""
        echo "========================================"
        echo "MODELWIJZIGINGEN STAGEN"
        echo "========================================"

        git add -A -- '*.pkl'

        echo ""
        echo "========================================"
        echo "STATUS NA git add -A"
        echo "========================================"

        git status --short

        echo ""
        echo "========================================"
        echo "GECACHEDE WIJZIGINGEN"
        echo "========================================"

        git diff --cached --stat || true

        # Geen wijzigingen = niets te committen.
        if git diff --cached --quiet; then

          echo ""
          echo "ℹ️ Geen wijzigingen aan modelbestanden."
          echo "Geen commit nodig."

          exit 0
        fi

        echo ""
        echo "========================================"
        echo "COMMIT"
        echo "========================================"

        git commit \
          -m "Auto-update: XGBoostV3 modellen"

        echo ""
        echo "========================================"
        echo "PUSH"
        echo "========================================"

        git push

        echo ""
        echo "========================================"
        echo "✅ KLAAR"
        echo "========================================"
        echo "XGBoostV3 modelwijzigingen zijn naar GitHub gepusht."
