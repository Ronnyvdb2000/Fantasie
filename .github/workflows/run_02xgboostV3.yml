name: XGBoostV3 Model Retraining

on:
  schedule:
    - cron: '0 3 * * 0'  # pas aan naar je bestaande schema indien anders
  workflow_dispatch:

jobs:
  train-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Uitpakken repository code
      uses: actions/checkout@v4

    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Benodigde pakketten installeren
      run: |
        python -m pip install --upgrade pip
        pip install xgboost==3.2.0 pandas scikit-learn joblib psycopg2-binary requests

    - name: Start training script
      env:
        SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
        TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        EMAIL_USER:       ${{ secrets.EMAIL_USER }}
        EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
        EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
      run: |
        python xgboostV3.py

    - name: Commit en push de nieuwe modellen naar de repo
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        gevonden=false
        for f in xgboostV3_10d_model.pkl xgboostV3_30d_model.pkl xgboostV3_60d_model.pkl; do
          if [ -f "$f" ]; then
            git add "$f"
            gevonden=true
          fi
        done
        if [ "$gevonden" = true ]; then
          git commit -m "Auto-update: xgboostV3 modellen hertraind op actuele data" || echo "Geen wijzigingen om te committeren"
          git push
        else
          echo "Geen enkel model getraind dit run â€” niets te committen."
        fi
