name: "A trade volatiel: Q score x volatiliteit"

on:
  schedule:
    - cron: "0 6 * * 6"   # zaterdag 06:00 UTC
  workflow_dispatch:

jobs:
  bot-combi-volatiel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scipy requests python-dotenv psycopg2-binary
      - name: Run a_trade_volatiel
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          MIN_ATR_PCT: "4.0"
          MAX_ATR_PCT: "25.0"
          TOP_N: "10"
        run: python a_trade_volatiel.py
