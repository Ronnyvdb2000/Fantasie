name: TEST - diagnose rank-kolommen (self-deletend)

# Eenmalig diagnostisch scriptje -- enkel handmatig te starten. Ruimt
# zichzelf EN test_diag_rank_kolommen.py na de run automatisch op (zelfde
# commit/push-patroon als verwijdercsv.yml), zodat er geen rommel
# achterblijft in de repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-en-opruimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install psycopg2-binary

      - name: Draai diagnose (enkel print, geen DB-wijzigingen)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python test_diag_rank_kolommen.py

      - name: Verwijder dit test-script en deze workflow
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f test_diag_rank_kolommen.py .github/workflows/test_diag_rank_kolommen.yml
          if git diff-index --quiet HEAD --; then
            echo "Niets om te verwijderen (bestanden al weg?)."
          else
            git commit -m "Automated: eenmalig diagnose-testscript opgeruimd"
            git push origin main
          fi
