name: Analyse Parameter IC

on:
  schedule:
    # Voer indien gewenst een cron toe (bijvoorbeeld dagelijks om 04:38 UTC, gebaseerd op je log)
    - cron: '38 4 * * *'
  workflow_dispatch: # Handmatig starten via GitHub UI

jobs:
  analyse-ic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scipy==1.14.1 \
            psycopg2-binary==2.9.10 \
            statsmodels==0.14.4 \
            python-dotenv

      - name: Verifieer installaties
        run: |
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import scipy; print('scipy', scipy.__version__)"
          python -c "import psycopg2; print('psycopg2 OK')"
          python -c "import statsmodels; print('statsmodels', statsmodels.__version__)"
          python -c "import dotenv; print('dotenv OK')"

      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "FOUT: SUPABASE_DB_URL secret ontbreekt"
            exit 1
          fi

      - name: Bot draaien
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p results
          python analyse_parameter_ic.py
          echo "Bestanden in results/:"
          ls -lh results/ || echo "(geen results map)"
          if [ ! -f results/parameter_ic_matrix.csv ]; then
            echo "WAARSCHUWING: parameter_ic_matrix.csv niet gevonden."
          else
            echo "OK: parameter_ic_matrix.csv ($(wc -l < results/parameter_ic_matrix.csv) regels)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        if: always() # Zorgt dat we het bestand ook uploaden als de vorige stap een waarschuwing gaf
        with:
          name: parameter-ic-results-${{ github.run_number }}
          path: results/parameter_ic_matrix.csv
          retention-days: 90
          if-no-files-found: warn
