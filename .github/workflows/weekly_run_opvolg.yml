name: Weekly Report Opvolg

on:
  schedule:
    - cron: '0 21 * * 5'   # Zelfde moment als Weekly Report (na sluiting Wall Street) -- onafhankelijke runner, geen conflict
  workflow_dispatch:

jobs:
  report-opvolg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas requests python-dotenv psycopg2-binary
      - name: Run Opvolg-analyse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python weekly_report_opvolg.py
