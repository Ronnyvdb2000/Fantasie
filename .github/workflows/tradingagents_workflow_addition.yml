# Toe te voegen als extra job/stappen in je bestaande bot_00vcp workflow,
# NA de stap die vcp_signals.json wegschrijft.
# Alles hier gebruikt gratis diensten: GitHub Actions (gratis quota),
# Groq API (gratis tier), Telegram/Gmail (al gratis in je huidige setup).

  tradingagents-analyse:
    needs: bot_00vcp          # pas aan naar de job-naam van je bestaande bot_00vcp job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eigen repo
        uses: actions/checkout@v4

      - name: Checkout TradingAgents
        uses: actions/checkout@v4
        with:
          repository: TauricResearch/TradingAgents
          path: TradingAgents

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: |
          pip install -r TradingAgents/requirements.txt
          pip install -e TradingAgents
          pip install requests

      - name: Download vcp_signals.json van vorige job
        uses: actions/download-artifact@v4
        with:
          name: vcp-signals
          path: .

      - name: Run TradingAgents-bridge
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tradingagents_bridge.py --signals-file vcp_signals.json --channel telegram
