name: "Feature Store: Generieke Technicals (ATR/RSI/MA/volume, strategie-onafhankelijk) — dagelijks"

on:
  schedule:
    - cron: "50 20 * * 1-5"
  workflow_dispatch:

jobs:
  bouw-generieke-technicals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary
      - name: Run bouw_generieke_technicals
        env:
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_TICKERS_PER_RUN: "400"
        run: python bouw_generieke_technicals.py build
