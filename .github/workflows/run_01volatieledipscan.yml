name: "Bot 01: Volatiele Dip-Scan — hoge-ATR mean reversion (a-lijsten) — wekelijks"

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

jobs:
  bot-01volhunter:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary
      - name: Run bot_01volhunter
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          MIN_ATR_PCT: "6.0"
          MAX_ATR_PCT: "60.0"
          IBS_MAX: "0.25"
          RSI_MAX: "15.0"
          VEREIST_UPTREND: "1"
          TOP_N: "3"
          BATCH_SIZE: "150"
        run: python bot_01volhunter.py live
