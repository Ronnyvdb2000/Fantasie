name: XLightGBM V2 training

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "xLightgbmV2.py"
      - ".github/workflows/lightgbm.yml"

permissions:
  contents: read

jobs:
  run-lightgbm:
    name: run-lightgbm
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
      TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER:       ${{ secrets.EMAIL_USER }}
      EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
      EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            lightgbm==4.6.0 \
            joblib==1.4.2 \
            psycopg2-binary==2.9.10 \
            requests==2.32.3

      - name: Check secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "FOUT: SUPABASE_DB_URL secret ontbreekt"
            exit 1
          fi

      - name: Run LightGBM V2 training
        run: |
          mkdir -p results
          python xLightgbmV2.py

      - name: Controle LightGBM modellen
        if: always()
        run: |
          shopt -s nullglob
          modellen=(results/lightgbmV2_*_model.pkl)
          if [ ${#modellen[@]} -eq 0 ]; then
            echo "WAARSCHUWING: geen enkel model gegenereerd."
          else
            for m in "${modellen[@]}"; do
              echo "OK: $(basename "$m")"
            done
          fi
          echo ""
          ls -lh results/ || true

      - name: Upload artifact
        if: always()
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: lightgbmV2-results
          path: results/
          retention-days: 30
          if-no-files-found: warn
