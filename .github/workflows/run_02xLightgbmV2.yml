name: XLightGBM V2 training

on:
  workflow_dispatch:

  # Schedule staat uit. Zet terug aan wanneer je V1 periodiek wilt draaien.
  # schedule:
  #   - cron: "0 21 * * *"

jobs:
  run-lightgbm:
    name: run-lightgbm
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
      TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER:       ${{ secrets.EMAIL_USER }}
      EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
      EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            lightgbm==4.6.0 \
            joblib==1.4.2 \
            psycopg2-binary==2.9.10 \
            requests==2.34.2

      - name: Controleer versies
        run: |
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import sklearn; print('scikit-learn', sklearn.__version__)"
          python -c "import lightgbm; print('lightgbm', lightgbm.__version__)"
          python -c "import joblib; print('joblib', joblib.__version__)"
          python -c "import psycopg2; print('psycopg2 OK')"
          python -c "import requests; print('requests', requests.__version__)"

      - name: Controleer secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "FOUT: SUPABASE_DB_URL secret ontbreekt"
            exit 1
          fi
          echo "SUPABASE_DB_URL is gezet (lengte: ${#SUPABASE_DB_URL})"

      - name: Maak results-map
        run: mkdir -p results

      - name: Run LightGBM V1
        run: python xLightgbm.py

      - name: Controle LightGBM modellen
        if: always()
        run: |
          echo "Controle LightGBM modellen:"
          shopt -s nullglob
          modellen=(results/lightgbmV1_*_model.pkl)
          if [ ${#modellen[@]} -eq 0 ]; then
            echo "WAARSCHUWING: geen enkel model gegenereerd."
          else
            for m in "${modellen[@]}"; do
              echo "OK: $(basename "$m") ($(stat -c%s "$m") bytes)"
            done
          fi
          echo ""
          echo "Bestanden in results/:"
          ls -lh results/ || echo "(geen bestanden)"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightgbmV1-results-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
