name: LightGBM V2 training

on:
  workflow_dispatch:
  schedule:
    # Elke dag om 06:00 UTC
    - cron: "0 6 * * *"
  push:
    paths:
      - "xLightgbmV2.py"
      - ".github/workflows/lightgbm.yml"

permissions:
  contents: read

jobs:
  run-lightgbm:
    name: run-lightgbm
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            lightgbm==4.6.0 \
            joblib==1.4.2 \
            psycopg2-binary==2.9.10

      - name: Verify installed versions
        run: |
          python --version
          python -c "import numpy;       print('numpy',       numpy.__version__)"
          python -c "import pandas;      print('pandas',      pandas.__version__)"
          python -c "import sklearn;     print('scikit-learn',sklearn.__version__)"
          python -c "import lightgbm;    print('lightgbm',    lightgbm.__version__)"
          python -c "import joblib;      print('joblib',      joblib.__version__)"
          python -c "import psycopg2;    print('psycopg2 OK')"

      - name: Run LightGBM V2 training
        run: |
          mkdir -p results
          python xLightgbmV2.py

      - name: Controle LightGBM modellen
        run: |
          echo "Controle LightGBM modellen:"
          shopt -s nullglob
          modellen=(results/lightgbmV2_*_model.pkl)
          if [ ${#modellen[@]} -eq 0 ]; then
            echo "FOUT: geen enkel model gegenereerd."
            exit 1
          fi
          for m in "${modellen[@]}"; do
            echo "OK: $(basename "$m")"
          done
          echo ""
          echo "Bestanden in results/:"
          ls -lh results/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lightgbmV2-results
          path: results/
          retention-days: 30
          if-no-files-found: warn
