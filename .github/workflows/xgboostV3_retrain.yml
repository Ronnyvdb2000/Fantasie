name: XGBoostV3 Model Retraining

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  train-and-update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 30

    steps:

      # ------------------------------------------------------
      # REPOSITORY
      # ------------------------------------------------------

      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ------------------------------------------------------
      # PACKAGES
      # ------------------------------------------------------

      - name: Benodigde pakketten installeren
        run: |
          python -m pip install --upgrade pip

          pip install \
            xgboost==3.2.0 \
            pandas \
            scikit-learn \
            joblib \
            psycopg2-binary \
            requests

      # ------------------------------------------------------
      # TRAINING
      # ------------------------------------------------------

      - name: Start XGBoostV3 training
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

        run: |
          python xgboostV3.py

      # ------------------------------------------------------
      # BESTANDEN CONTROLEREN
      # ------------------------------------------------------

      - name: Controleer alle drie modelbestanden
        shell: bash
        run: |
          set -euo pipefail

          MODELLEN=(
            "xgboostV3_10d_model.pkl"
            "xgboostV3_30d_model.pkl"
            "xgboostV3_60d_model.pkl"
          )

          echo "=========================================="
          echo "CONTROLE XGBOOSTV3 MODELLEN"
          echo "=========================================="

          for MODEL in "${MODELLEN[@]}"; do

            echo ""
            echo "Controle: $MODEL"

            if [ ! -f "$MODEL" ]; then
              echo "❌ Bestand ontbreekt: $MODEL"
              exit 1
            fi

            SIZE=$(stat -c%s "$MODEL")

            echo "Grootte: $SIZE bytes"

            if [ "$SIZE" -le 0 ]; then
              echo "❌ BESTAND IS LEEG: $MODEL"
              exit 1
            fi

            echo "✅ Bestand bestaat en is niet leeg."

          done

          echo ""
          echo "=========================================="
          echo "ALLE MODELFILES ZIJN AANWEZIG."
          echo "=========================================="

      # ------------------------------------------------------
      # EXTRA PYTHON LOAD TEST
      # ------------------------------------------------------

      - name: Test of modellen opnieuw geladen kunnen worden
        run: |
          python - <<'PY'
          import os
          import joblib

          modellen = [
              "xgboostV3_10d_model.pkl",
              "xgboostV3_30d_model.pkl",
              "xgboostV3_60d_model.pkl",
          ]

          verwachte_features = [
              "atr14",
              "atr14_pct",
              "rsi14",
              "ibs",
              "ma50",
              "ma200",
              "pct_from_ma50",
              "pct_from_ma200",
              "vol_ratio_20d",
              "high52w",
              "pct_from_high52w",
          ]

          for bestand in modellen:

              print(f"\nControle: {bestand}")

              grootte = os.path.getsize(bestand)

              if grootte <= 0:
                  raise RuntimeError(
                      f"{bestand} is leeg."
                  )

              model = joblib.load(bestand)

              if not hasattr(model, "predict_proba"):
                  raise RuntimeError(
                      f"{bestand} heeft geen predict_proba()."
                  )

              features = list(
                  getattr(model, "feature_names_in_", [])
              )

              if features != verwachte_features:
                  raise RuntimeError(
                      f"Verkeerde features in {bestand}.\n"
                      f"Verwacht: {verwachte_features}\n"
                      f"Gevonden: {features}"
                  )

              print(
                  f"✅ {bestand}: "
                  f"{grootte:,} bytes, "
                  f"{len(features)} features"
              )

          print("\n✅ Alle drie modellen zijn geldig en laadbaar.")
          PY

      # ------------------------------------------------------
      # GIT STATUS
      # ------------------------------------------------------

      - name: Toon gewijzigde modelbestanden
        run: |
          git status --short

          echo ""
          echo "Modelbestanden:"

          ls -lh \
            xgboostV3_10d_model.pkl \
            xgboostV3_30d_model.pkl \
            xgboostV3_60d_model.pkl

      # ------------------------------------------------------
      # COMMIT + PUSH
      # ------------------------------------------------------

      - name: Commit en push nieuwe modellen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add \
            xgboostV3_10d_model.pkl \
            xgboostV3_30d_model.pkl \
            xgboostV3_60d_model.pkl

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de modellen."
          else
            git commit -m \
              "Auto-update: XGBoostV3 modellen hertraind"

            git push
          fi

      # ------------------------------------------------------
      # EINDCONTROLE
      # ------------------------------------------------------

      - name: Eindcontrole
        run: |
          echo ""
          echo "=========================================="
          echo "XGBOOSTV3 RETRAINING SUCCESVOL"
          echo "=========================================="
          echo ""
          echo "10d:"
          ls -lh xgboostV3_10d_model.pkl
          echo ""
          echo "30d:"
          ls -lh xgboostV3_30d_model.pkl
          echo ""
          echo "60d:"
          ls -lh xgboostV3_60d_model.pkl
          echo ""
          echo "De scoring-workflow kan nu de modellen gebruiken."
