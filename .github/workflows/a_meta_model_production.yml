name: A Meta-model train + score

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      retrain:
        description: "Model opnieuw trainen? (true = ja, false = alleen scoren)"
        required: false
        default: "false"

concurrency:
  group: meta-model-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analysis.txt

      - name: Trainen (alleen als retrain=true)
        if: github.event.inputs.retrain == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python a_meta_model_train.py --alpha 1.0 --notities "auto-train" \
            2>&1 | tee meta_model_train.log

      - name: Scoren
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python a_meta_model_score.py 2>&1 | tee meta_model_score.log

      - name: Logs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-model-production-${{ github.run_number }}
          path: |
            meta_model_train.log
            meta_model_score.log
          if-no-files-found: ignore
          retention-days: 30
