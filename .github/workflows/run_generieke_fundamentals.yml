name: "Feature Store: Generieke Fundamentals — vult FCF/P.E/Piotroski/PEG voor nieuwe selecties — dagelijks"

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  bouw-generieke-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests psycopg2-binary
      - name: Run bouw_generieke_fundamentals
        env:
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_TICKERS_PER_RUN: "200"
          RECENTE_DAGEN_LIMIET: "5"
        run: python bouw_generieke_fundamentals.py build
