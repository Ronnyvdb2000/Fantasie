name: "Bot 00: FULL Scanner (041-059) VCP"

on:
  schedule:
    - cron: "05 20 * * 1-5"
  workflow_dispatch:

jobs:
  bot-00vcp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests python-dotenv libsql-experimental
      - name: Run bot_00vcp
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:          ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:          ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:      ${{ secrets.EMAIL_RECEIVER }}
          TURSO_DATABASE_URL:  ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:    ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python bot_00vcp.py live
      - name: Upload vcp_signals.json als artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcp-signals
          path: vcp_signals.json
          retention-days: 1
      - name: Opslaan CSV
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f vcp_signalen_*.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "bot_00vcp $(date '+%Y-%m-%d')"
          git pull --rebase=false -X ours origin main
          git push

  # Uitgeschakeld op [huidige datum] — de TradingAgents-koppeling gaf op de
  # gratis Groq-tier weinig meerwaarde: met online_tools=False (nodig om
  # gratis te blijven) analyseert de LLM enkel dezelfde technische data die
  # bot_00vcp.py al numeriek en foutloos berekent, zonder het nieuws/sentiment
  # dat de oorspronkelijke meerwaarde had moeten zijn. Bovendien faalt een
  # aanzienlijk deel van de aanvragen nog steeds op TPM-rate-limits (413/429)
  # bij data-rijke tickers. Bridge-script (tradingagents_bridge.py) blijft
  # staan voor eventueel later gebruik — bv. als online_tools weer aan kan
  # op een betaalde tier, of enkel op de beste signalen (score 7-8/8).
  # Verwijder "if: false" hieronder om de job weer te activeren.
  tradingagents-analyse:
    needs: bot-00vcp
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout eigen repo
        uses: actions/checkout@v4

      - name: Checkout TradingAgents
        uses: actions/checkout@v4
        with:
          repository: TauricResearch/TradingAgents
          path: TradingAgents

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: |
          pip install ./TradingAgents
          pip install requests

      - name: Download vcp_signals.json van vorige job
        uses: actions/download-artifact@v4
        with:
          name: vcp-signals
          path: .

      - name: Run TradingAgents-bridge
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tradingagents_bridge.py --signals-file vcp_signals.json --channel telegram
