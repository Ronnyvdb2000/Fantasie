name: "XGBoostV3 Scoring — top nieuwe selecties naar Telegram en mail — dagelijks"

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  score-selecties:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            --retries 10 \
            --timeout 60 \
            --only-binary=:all: \
            xgboost==3.2.0 \
            pandas \
            scikit-learn \
            joblib \
            psycopg2-binary \
            requests

      - name: Run score_xgboost
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          TOP_N: "10"
          LOOKBACK_DAGEN: "3"
        run: |
          python score_xgboost.py
