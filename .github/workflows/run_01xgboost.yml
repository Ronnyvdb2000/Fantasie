name: "Bot 01: FULL scanner (041-059) XGBoost richtingsvoorspelling non actief"

# ============================================================
# STATUS (2026-08-20): GEPAUZEERD â€” NIET automatisch actief
# ============================================================
# De geplande triggers hieronder staan bewust UITGESCHAKELD (zie de
# uitgecommentarieerde 'schedule:'-sectie). Reden: na uitgebreide
# walk-forward-validatie (10 features, universum-brede marktcontext,
# per-beurs marktcontext) bleef de out-of-sample AUC steeds zwak
# (~0,51-0,53) en versloeg geen enkele variant consistent en overtuigend
# de eenvoudige "koop alles binnen het universum"-baseline
# (~+1,2% per periode). Het beste resultaat tot nu toe (10 features,
# zonder marktcontext) haalde +10,2% over de backtestperiode 2019-2026,
# maar met slechts 33 walk-forward-folds is dat te weinig om betrouwbaar
# te onderscheiden van toeval, en twee latere varianten kwamen juist
# duidelijk negatief uit. Conclusie: geen bewezen edge, dus niet
# geschikt om als volwaardige 8e strategie live te laten meedraaien.
#
# De code en het laatst getrainde model blijven in de repo staan als
# afgerond, gedocumenteerd experiment. `workflow_dispatch` hieronder
# blijft beschikbaar voor handmatige runs (bv. nieuwe experimenten met
# andere features, zoals meta-features op basis van de bestaande
# strategie-scores in de `selecties`-tabel).
#
# Om de geplande live/train-runs te heractiveren: haal de '#' weg bij
# de 'schedule:'-regels hieronder, alleen nadat een nieuwe aanpak
# overtuigend beter heeft gepresteerd dan de baseline over meerdere
# onafhankelijke periodes.
# ============================================================

on:
  # schedule:
  #   # Live scan: weekdagen 19:50 UTC, zelfde tijdstip als bot_01cointegr/bot_01marktsent
  #   - cron: "50 19 * * 1-5"
  #   # Hertraining: elke zondag 06:00 UTC (voor de MRA Nitro filter-run om 07:00 UTC),
  #   # zodat het model wekelijks bijblijft met de meest recente marktdata.
  #   - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modus (enkel voor handmatige run): live, train of backtest"
        required: false
        default: "backtest"
        type: choice
        options:
          - live
          - train
          - backtest

jobs:
  bepaal-modus:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.kies.outputs.mode }}
    steps:
      - id: kies
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 0" ]; then
            echo "mode=train" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
          fi

  bot-01xgboost-live:
    needs: bepaal-modus
    if: needs.bepaal-modus.outputs.mode == 'live'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests psycopg2-binary xgboost scikit-learn
      - name: Run bot_01xgboost (live)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
        run: python bot_01xgboost.py live

  bot-01xgboost-train:
    needs: bepaal-modus
    if: needs.bepaal-modus.outputs.mode == 'train'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests psycopg2-binary xgboost scikit-learn
      - name: Run bot_01xgboost (train)
        run: python bot_01xgboost.py train
      - name: Model committen
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add model_xgboost.json model_xgboost_meta.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen aan het model."
          else
            git commit -m "Hertraining bot_01xgboost $(date +%Y-%m-%d)"
            git pull --rebase=false -X ours origin main
            git push
          fi

  # Handmatige backtest-run (workflow_dispatch met mode=backtest) â€” resultaten
  # verschijnen enkel in de Actions-log, er wordt niets gecommit of verstuurd.
  bot-01xgboost-backtest:
    needs: bepaal-modus
    if: needs.bepaal-modus.outputs.mode == 'backtest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer packages
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests psycopg2-binary xgboost scikit-learn
      - name: Run bot_01xgboost (backtest)
        run: python bot_01xgboost.py backtest
